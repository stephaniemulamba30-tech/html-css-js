<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steph</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form">
            <h2>Form</h2>
            <form action="">
                <div class="group">
                    <label for="fname">Name:</label>
                    <input type="text" id="fname" name="fname" placeholder="Enter your name">
                </div>

                <div class="group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="grid-2">
                    <div class="group">
                        <label for="dob">Date de naissance</label>
                        <input type="date" id="dob" name="dob">
                    </div>

                    <div class="group">
                        <label for="gender">Genre</label>
                        <select id="gender" name="gender">
                            <option value="">Select your gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="group">
                        <label for="country">Pays</label>
                        <select id="country" name="country">
                            <option value="">Select your country</option>
                            <option value="france">France</option>
                            <option value="usa">USA</option>
                            <option value="uk">UK</option>
                        </select>
                    </div>

                    <div class="group">
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                    </div>
                </div>

                <div class="group">
                    <button class="btn" type="submit">Register</button>
                </div>
            </form>
        </div>

        <div class="data">

            <h2 class="data-title" style="color: red; text-decoration: underline; text-align: center;background-color: lightgray;padding: 10px;">CRUD actions using PHP and SQL</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <!-- <th>Date de naissance</th> -->
                        <th>Genre</th>
                        <!-- <th>Pays</th> -->
                        <!-- <th>Phone</th> -->
                        <th>
                            Actions
                        </th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <tr>
                        <td>John Doe</td>
                        <td>john.doe@example.com</td>
                        <!-- <td>1990-01-01</td> -->
                        <td>Male</td>
                        <!-- <td>USA</td> -->
                        <!-- <td>123-456-7890</td> -->
                        <td>
                            <button class="edit-btn">Edit</button>
                            <button class="view-btn">View</button>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>John Doe</td>
                        <td>john.doe@example.com</td>
                        <!-- <td>1990-01-01</td> -->
                        <td>Male</td>
                        <!-- <td>USA</td> -->
                        <!-- <td>123-456-7890</td> -->
                        <td>
                            <button class="edit-btn" title="Edit">Edit</button>
                            <button class="view-btn" title="View">View</button>
                            <button class="delete-btn" title="Delete">Delete</button>
                        </td>
                    </tr>
                   
                    
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
